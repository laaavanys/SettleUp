services:
  - type: web
    name: settleup-backend
    runtime: node
    plan: free
    buildCommand: "cd backend && npm install"
    startCommand: "cd backend && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "SettleUp <onboarding@resend.dev>"
      - key: APP_URL
        value: https://settleup-frontend.onrender.com

  - type: web
    name: settleup-frontend
    runtime: static
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://settleup-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
